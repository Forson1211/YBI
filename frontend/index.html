<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, interactive-widget=resizes-content" />
    <title>Young Beginners Inspiration | Your voice is a beginning</title>
    <meta name="description" content="Young Beginners Inspiration creates a platform for the young and the aged to inspire, learn, and become responsible leaders." />
    <meta name="theme-color" content="#073c52" />
    <link rel="icon" type="image/png" href="/ybi-assets/brand/ybi-logo.png" />
    
    <!-- Preconnect & Preload Fonts to eliminate layout shifts on refresh -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" />

    <!-- Preload critical brand assets -->
    <link rel="preload" as="image" href="/ybi-assets/brand/ybi-logo.png" />
    <link rel="preload" as="image" href="/ybi-assets/homepage/ybi-hero.jpg" fetchpriority="high" />

    <style>
      :root {
        --cream: #fffaf0;
        --white: #ffffff;
        --blue: #0b5d7b;
        --blue-deep: #073c52;
        --red: #ea211d;
        --yellow: #ffd000;
        --ink: #183541;
        --header-height: 75px;
      }
      *, *::before, *::after {
        box-sizing: border-box;
        border-radius: 0 !important;
      }
      html, body {
        margin: 0;
        padding: 0;
        background-color: #fffaf0;
        color: #183541;
        font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      /* Pre-hydration instant topbar for public site */
      .ybi-prehydrate-header {
        height: 75px;
        background: #ffffff;
        border-bottom: 1px solid rgba(7, 60, 82, 0.14);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 50px;
      }
      .ybi-prehydrate-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .ybi-prehydrate-brand img {
        height: 48px;
        width: auto;
      }
    </style>

    <script>
      (function () {
        try {
          var p = window.location.pathname || "";
          if (p.startsWith("/admin")) {
            document.documentElement.style.backgroundColor = "#073c52";
            document.documentElement.style.color = "#ffffff";
            if (document.body) {
              document.body.style.backgroundColor = "#073c52";
              document.body.style.color = "#ffffff";
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <script>
      try {
        if (window.location.pathname.startsWith("/admin")) {
          document.body.style.backgroundColor = "#073c52";
          document.body.style.color = "#ffffff";
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
